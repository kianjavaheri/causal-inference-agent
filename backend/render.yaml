services:
  - type: web
    name: causal-inference-agent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      # Leave unset to run in rule-based mode; set it to enable LLM planning and reports.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: ANTHROPIC_REPORT_MODEL
        value: claude-sonnet-5
      # Set this to your deployed frontend's origin before going live.
      - key: CORS_ORIGINS
        sync: false
